<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DZ//TERMINAL — kumuii</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Major+Mono+Display&display=swap" rel="stylesheet" />
<style>
  :root {
    --mono: 'VT323', monospace;
    --maj: 'Major Mono Display', monospace;
    --green: #38ff7e;
    --green-dim: #1c9c4d;
    --amber: #ffb52e;
    --red: #ff3b54;
    --cyan: #36e0ff;
    --bg: #02110a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    width: 1280px; height: 860px; background: #000;
    font-family: var(--mono); color: var(--green);
    position: relative; cursor: default; user-select: none;
  }
  /* CRT shell */
  #crt {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 120% at 50% 50%, #04240f 0%, #02110a 55%, #010a06 100%);
    overflow: hidden;
  }
  #crt::before { /* scanlines */
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,0) 4px);
  }
  #crt::after { /* vignette + flicker */
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 51;
    box-shadow: inset 0 0 160px rgba(0,0,0,.9), inset 0 0 40px rgba(0,40,20,.5);
    background: radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.5));
    animation: flick 6s steps(60) infinite;
  }
  @keyframes flick { 0%,97%,100%{opacity:1;} 98%{opacity:.82;} 99%{opacity:.93;} }

  .screen { position: absolute; inset: 0; padding: 30px 40px 24px; display: flex; flex-direction: column; z-index: 10;
    text-shadow: 0 0 6px rgba(56,255,126,.55); }

  /* top status bar */
  .statusbar { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--green-dim); padding-bottom: 8px; margin-bottom: 4px; font-size: 21px; }
  .statusbar .sys { color: var(--amber); letter-spacing: 1px; }
  .statusbar .sys b { color: var(--green); }
  .statusbar .right { color: var(--green-dim); }
  .statusbar .right .blink { color: var(--red); animation: bl 1.1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0; } }

  /* main split */
  .main { flex: 1; display: grid; grid-template-columns: 188px 1fr; gap: 0; min-height: 0; }
  /* left command rail */
  .rail { border-right: 1px solid var(--green-dim); padding: 14px 16px 14px 2px; }
  .rail .lbl { color: var(--green-dim); font-size: 19px; margin-bottom: 10px; letter-spacing: 2px; }
  .cmd { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    font-family: var(--mono); font-size: 23px; color: var(--green); padding: 5px 8px; margin-bottom: 2px;
    border-left: 3px solid transparent; }
  .cmd:hover, .cmd.active { color: #d6ffe6; background: rgba(56,255,126,.10); border-left-color: var(--amber); }
  .cmd .k { color: var(--amber); }
  .rail .foot { margin-top: 22px; color: var(--green-dim); font-size: 18px; line-height: 1.4; }
  .rail .foot a { color: var(--cyan); text-decoration: none; }
  .rail .foot a:hover { text-shadow: 0 0 8px var(--cyan); }

  /* output pane */
  .pane { padding: 16px 8px 16px 26px; overflow: hidden; position: relative; }
  .out { font-size: 22px; line-height: 1.35; }
  .out .ln { white-space: pre-wrap; }
  .out .pmt { color: var(--amber); }
  .out .dim { color: var(--green-dim); }
  .out .cy { color: var(--cyan); }
  .out .rd { color: var(--red); }
  .out .wh { color: #e6fff0; }
  .ascii { font-size: 15px; line-height: 1.05; color: var(--green); white-space: pre; text-shadow: 0 0 7px rgba(56,255,126,.6); }
  .cursor { display: inline-block; width: 11px; height: 22px; background: var(--green); vertical-align: -3px;
    animation: bl 1s steps(2) infinite; box-shadow: 0 0 8px var(--green); }

  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 2px 14px; margin: 6px 0; }
  .kv .k { color: var(--amber); }

  .card { border: 1px solid var(--green-dim); padding: 9px 13px; margin: 8px 0; }
  .card h4 { margin: 0 0 3px; font-size: 24px; color: #d6ffe6; font-weight: normal; }
  .card h4 .st { color: var(--amber); font-size: 18px; }
  .card p { margin: 0; font-size: 20px; color: var(--green); }
  .card .t { color: var(--cyan); font-size: 18px; }

  /* music equalizer */
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin: 12px 0; border-bottom: 1px solid var(--green-dim); padding-bottom: 2px; }
  .eq i { width: 12px; background: linear-gradient(180deg, var(--amber), var(--green)); height: 6%; box-shadow: 0 0 8px rgba(56,255,126,.5); }
  .tracks .tk { display: flex; justify-content: space-between; padding: 5px 10px; font-size: 22px; cursor: pointer;
    border: 1px solid transparent; }
  .tracks .tk:hover { background: rgba(56,255,126,.10); border-color: var(--green-dim); }
  .tracks .tk.on { color: var(--amber); border-color: var(--amber); }
  .tracks .tk .n { color: var(--cyan); margin-right: 12px; }
  .mctrl { margin-top: 12px; font-size: 22px; }
  .mctrl button { font-family: var(--mono); font-size: 22px; background: none; color: var(--green);
    border: 1px solid var(--green-dim); padding: 3px 14px; cursor: pointer; margin-right: 8px; }
  .mctrl button:hover { background: rgba(56,255,126,.12); color: #d6ffe6; }
  .mctrl .np { color: var(--amber); margin-left: 6px; }

  /* boot overlay */
  #boot { position: absolute; inset: 0; z-index: 200; background: #010a06; padding: 40px 50px;
    font-size: 21px; line-height: 1.4; color: var(--green); text-shadow: 0 0 6px rgba(56,255,126,.5); }
  #boot .ok { color: var(--amber); }
  #boot.done { display: none; }
  .glitch { position: relative; }
</style>
</head>
<body>
<div id="crt">
  <div class="screen">
    <div class="statusbar">
      <div class="sys">DISPUTED_ZONE//TERMINAL <b>v19.XX</b> · node: <b>KUMUII</b></div>
      <div class="right">LINK: <span style="color:var(--green)">SECURE</span> · <span class="blink">●REC</span> · <span id="clk">00:00:00</span></div>
    </div>
    <div class="main">
      <div class="rail">
        <div class="lbl">// COMMANDS</div>
        <button class="cmd active" data-cmd="whoami"><span class="k">›</span> whoami</button>
        <button class="cmd" data-cmd="projects"><span class="k">›</span> projects</button>
        <button class="cmd" data-cmd="music"><span class="k">›</span> play_music</button>
        <button class="cmd" data-cmd="peripeteia"><span class="k">›</span> peripeteia</button>
        <button class="cmd" data-cmd="contact"><span class="k">›</span> contact</button>
        <div class="foot">
          uplink //<br>
          <a href="https://github.com/kumuii" target="_blank">github/kumuii</a><br>
          <a href="https://x.com/CriPerS3" target="_blank">x/CriPerS3</a><br>
          <a href="mailto:contact@kumuii.dev">@kumuii.dev</a>
        </div>
      </div>
      <div class="pane"><div class="out" id="out"></div></div>
    </div>
  </div>
</div>

<!-- BOOT -->
<div id="boot"></div>

<script src="synth.js"></script>
<script>
(function () {
  'use strict';
  const out = document.getElementById('out');
  const SONGS = window.CHIP_SONGS;
  const synth = new ChipSynth();
  synth.setVolume(0.7);
  const order = ['disputedZone', 'neonDream', 'canon', 'odeToJoy', 'greensleeves'];
  let cur = 0, playing = false, secTimer, secs = 0;

  // ---- clock
  function clk() {
    const d = new Date();
    document.getElementById('clk').textContent =
      [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  }
  clk(); setInterval(clk, 1000);

  // ---- type printing
  function typeLines(lines, el, done) {
    el.innerHTML = '';
    let i = 0;
    (function next() {
      if (i >= lines.length) { if (done) done(); return; }
      const div = document.createElement('div');
      div.className = 'ln';
      div.innerHTML = lines[i];
      el.appendChild(div);
      i++;
      setTimeout(next, 60 + Math.random() * 70);
    })();
  }

  // ---- boot sequence
  const boot = document.getElementById('boot');
  const bootLines = [
    'DZ-BIOS (C) 19XX International Disputed Zone Systems',
    'POST .................................. <span class="ok">[OK]</span>',
    'mounting /dev/cortex ................... <span class="ok">[OK]</span>',
    'cybernetic link handshake ............. <span class="ok">[OK]</span>',
    'loading operator profile: KUMUII ...... <span class="ok">[OK]</span>',
    'thermoptic camo ....................... <span class="ok">[STANDBY]</span>',
    'decrypting earl_grey.cfg .............. <span class="ok">[OK]</span>',
    '',
    'welcome back, operator.',
    'establishing terminal' + '.'.repeat(3),
  ];
  let bi = 0;
  (function bootStep() {
    if (bi >= bootLines.length) {
      setTimeout(() => { boot.classList.add('done'); run('whoami'); }, 500);
      return;
    }
    const d = document.createElement('div');
    d.innerHTML = bootLines[bi] || '&nbsp;';
    boot.appendChild(d);
    bi++;
    setTimeout(bootStep, 230 + Math.random() * 120);
  })();

  // ---- ascii bust
  const ascii =
`        ▄▄████▄▄
      ▟██▀    ▀██▙
     ▐██  ◣  ◢  ██▌
     ▐██   ▽▽   ██▌      OPERATOR // MARIE-CLASS
      ▜██▄ ── ▄██▛       cybernetic merc, freelance
       ▝▀████████▀▘      earl grey · cactus · no gods
      ▟█▛  ████  ▜█▙
     ▟██   ████   ██▙`;

  // ---- command content
  const CMDS = {
    whoami() {
      return [
        '<span class="pmt">operator@DZ</span>:~$ whoami',
        '<pre class="ascii">' + ascii + '</pre>',
        '<span class="wh">CHRISTOPHER PEROV</span> <span class="dim">// alias</span> <span class="cy">kumuii</span>',
        '',
        '<div class="kv"><span class="k">role</span><span>hobby game dev + 3D artist / animator</span>' +
        '<span class="k">tools</span><span>Unity · C# · Blender · the will to keep going</span>' +
        '<span class="k">langs</span><span>C# · PHP · Python · JavaScript</span>' +
        '<span class="k">status</span><span><span class="cy">building immersive sims in the dark</span></span></div>',
        '<span class="dim"># this terminal is my homepage. pick a command on the left.</span>',
      ];
    },
    projects() {
      return [
        '<span class="pmt">operator@DZ</span>:~$ ls ~/projects',
        '<div class="card"><h4>untitled_immersive_sim <span class="st">[WIP]</span></h4>' +
        '<p>stealth-action prototype. light/shadow + sound meter, leaning, 3D-tetris inventory.</p>' +
        '<span class="t">unity · c# · 90% peripeteia-brained</span></div>',
        '<div class="card"><h4>disputed_zone_assets <span class="st">[WIP]</span></h4>' +
        '<p>brutalist sci-fi prop set + a cyborg merc bust. low-poly, PS1-era textures.</p>' +
        '<span class="t">blender · 3D · rigged</span></div>',
        '<div class="card"><h4>kumuii.dev <span class="st">[LIVE]</span></h4>' +
        '<p>this hub. no frameworks — hand-built CRT + a chiptune synth in the browser.</p>' +
        '<span class="t">html · web audio</span></div>',
      ];
    },
    peripeteia() {
      return [
        '<span class="pmt">operator@DZ</span>:~$ cat peripeteia.log',
        '<span class="rd">&gt;&gt; THE YEAR IS 19XX.</span>',
        '<span class="wh">a metal sprawl on a contested border. the cold war never ended.</span>',
        'cybernetics with no ethics committee. ideology as a weapon.',
        'a one-woman army — half machine, drinks earl grey, keeps cacti.',
        '',
        '<span class="cy">the immersive sim that rewired me. everything i make is</span>',
        '<span class="cy">downstream of this place.</span>',
        '<span class="dim">[ obsession level: terminal ]</span>',
      ];
    },
    contact() {
      return [
        '<span class="pmt">operator@DZ</span>:~$ ping operator',
        '<div class="kv"><span class="k">mail</span><span><span class="cy">contact@kumuii.dev</span></span>' +
        '<span class="k">github</span><span><span class="cy">github.com/kumuii</span></span>' +
        '<span class="k">x</span><span><span class="cy">@CriPerS3</span></span>' +
        '<span class="k">discord</span><span>kumuii</span></div>',
        '<span class="dim"># transmissions welcome. especially about cyborgs.</span>',
      ];
    },
  };

  function run(name) {
    document.querySelectorAll('.cmd').forEach(c => c.classList.toggle('active', c.dataset.cmd === name));
    if (name === 'music') { renderMusic(); return; }
    const lines = CMDS[name]();
    lines.push('<span class="pmt">operator@DZ</span>:~$ <span class="cursor"></span>');
    typeLines(lines, out);
  }

  // ---- music view
  function renderMusic() {
    out.innerHTML = '';
    const head = document.createElement('div');
    head.innerHTML = '<span class="pmt">operator@DZ</span>:~$ ./kumuii_radio --play';
    out.appendChild(head);

    const eq = document.createElement('div'); eq.className = 'eq';
    for (let i = 0; i < 40; i++) eq.appendChild(document.createElement('i'));
    out.appendChild(eq);
    const bars = [...eq.children];

    const tracks = document.createElement('div'); tracks.className = 'tracks';
    order.forEach((id, i) => {
      const s = SONGS[id];
      const tk = document.createElement('div'); tk.className = 'tk' + (i === cur && playing ? ' on' : '');
      tk.innerHTML = '<span><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' + s.name + '</span><span class="dim">' + s.by + '</span>';
      tk.onclick = () => { cur = i; play(); };
      tracks.appendChild(tk);
    });
    out.appendChild(tracks);

    const ctrl = document.createElement('div'); ctrl.className = 'mctrl';
    ctrl.innerHTML = '<button id="mp">' + (playing ? '◼ stop' : '▶ play') + '</button>' +
      '<button id="mn">▶▶ next</button><span class="np" id="np"></span>';
    out.appendChild(ctrl);

    // viz animation hook
    window._bars = bars;
    document.getElementById('mp').onclick = () => playing ? stop() : play();
    document.getElementById('mn').onclick = () => { cur = (cur + 1) % order.length; play(); };
    updateNP();
    animViz(playing);
  }
  function updateNP() {
    const np = document.getElementById('np');
    if (np) np.textContent = playing ? '♪ now playing: ' + SONGS[order[cur]].name : 'idle';
  }
  let vizRAF;
  function animViz(on) {
    clearTimeout(vizRAF);
    const bars = window._bars; if (!bars) return;
    if (!on) { bars.forEach(b => b.style.height = '6%'); return; }
    (function loop() {
      bars.forEach(b => b.style.height = (6 + Math.random() * 94) + '%');
      vizRAF = setTimeout(loop, 95);
    })();
  }
  function play() {
    playing = true; synth.play(order[cur]);
    if (document.querySelector('.tracks')) renderMusic();
    animViz(true);
  }
  function stop() {
    playing = false; synth.stop();
    if (document.querySelector('.tracks')) renderMusic();
    animViz(false);
  }

  document.querySelectorAll('.cmd').forEach(c => c.addEventListener('click', () => run(c.dataset.cmd)));
})();
</script>
</body>
</html>
