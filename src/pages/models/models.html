<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Models - Kumuii</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../../../public/images/logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="models.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-logo">3D Showcase</div>
            <div class="nav-links">
                <a href="#chibi-space" class="nav-link">Chibis</a>
                <a href="#character-space" class="nav-link">Characters</a>
                <a href="#fps-space" class="nav-link">FPS</a>
                <a href="#props-space" class="nav-link">Props</a>
            </div>
            <a href="../../../index.html#my-work" class="nav-back">← Back</a>
        </div>
    </nav>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
        <span>Scroll</span>
        <div class="scroll-line"></div>
    </div>

    <!-- Models Container -->
    <div class="models-container">

        <!-- Chibi Characters Space -->
        <section class="model-space chibi-space" id="chibi-space">
            <div class="space-title">Chibi Characters</div>
            <div class="space-canvas" data-group="chibi"></div>
        </section>

        <!-- Full Size Characters Space -->
        <section class="model-space character-space" id="character-space">
            <div class="space-title">Full Size Characters</div>
            <div class="space-canvas" data-group="character"></div>
        </section>

        <!-- FPS Assets Space -->
        <section class="model-space fps-space" id="fps-space">
            <div class="space-title">FPS Assets</div>
            <div class="space-canvas" data-group="fps"></div>
        </section>

        <!-- Props Space -->
        <section class="model-space props-space" id="props-space">
            <div class="space-title">Environment Props</div>
            <div class="space-canvas" data-group="props"></div>
        </section>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script type="module" src="./models.js"></script>
</body>
</html>
