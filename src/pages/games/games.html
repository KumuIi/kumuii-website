<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME ARCHIVE :: KUMUII</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <!-- Static TV Noise Background -->
    <div class="tv-static"></div>
    
    <!-- CRT Screen Container -->
    <div class="crt-container">
        <!-- Scanlines -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
        
        <!-- VHS Tracking Lines -->
        <div class="tracking-line"></div>
        <div class="tracking-line"></div>
        
        <!-- Main Content -->
        <div class="archive-screen">
            
            <!-- Header -->
            <header class="archive-header">
                <div class="glitch-title" data-text="[[ GAME ARCHIVE ]]">[[ GAME ARCHIVE ]]</div>
                <div class="vcr-timestamp">REC ● 1987.12.25 23:59</div>
                <a href="/#my-work" class="exit-btn">◄◄ EXIT ARCHIVE</a>
            </header>
            
            <!-- Gallery Grid -->
            <div class="games-gallery">
                
                <!-- Game Box 1: EliteElf -->
                <article class="game-box" data-game="eliteelf">
                    <div class="tv-frame">
                        <div class="static-burst"></div>
                        <div class="game-thumbnail">
                            <img src="../../../public/images/eliteelf-thumb.jpg" alt="EliteElf Game">
                        </div>
                    </div>
                    <div class="game-label">
                        <h2 class="game-name">ELITE ELF</h2>
                        <p class="game-year">1987 • PLATFORMER • UNITY</p>
                        <p class="game-tagline">3D MARIO-INSPIRED CHRISTMAS ADVENTURE</p>
                        <a href="eliteElf/eliteElf.html" class="enter-btn">► ENTER ARCHIVE</a>
                    </div>
                </article>
                
                <!-- Game Box 2: Coming Soon -->
                <article class="game-box" data-game="comingsoon">
                    <div class="tv-frame">
                        <div class="static-burst active"></div>
                        <div class="game-thumbnail coming-soon">
                            <div class="signal-lost">
                                <div class="bars"></div>
                                <p>NO SIGNAL</p>
                            </div>
                        </div>
                    </div>
                    <div class="game-label">
                        <h2 class="game-name">PROJECT ???</h2>
                        <p class="game-year">19?? • ??????? • ?????</p>
                        <p class="game-tagline">SIGNAL LOST - PLEASE STAND BY</p>
                        <button class="enter-btn disabled" disabled>► LOCKED</button>
                    </div>
                </article>
                
            </div>
            
            <!-- Footer -->
            <footer class="archive-footer">
                <div class="status-bar">
                    <span class="blink">▌</span>
                    <span>SYSTEM STATUS: OPERATIONAL</span>
                    <span class="blink">▐</span>
                </div>
            </footer>
            
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script src="games.js"></script>
</body>
</html>
