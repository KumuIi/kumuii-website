<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kumuii 3D Models - Interactive showcase of chibi characters, FPS assets, and environment props.">
    <title>3D Models - Kumuii</title>

    <link rel="icon" type="image/png" href="../../public/images/logo.png">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="models.css">
    <link rel="stylesheet" href="../src/style.css">

    <!-- Inline style to prevent flash on transition -->
    <style>
        .transition-cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #6366f1;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
        }
        .transition-cover.active {
            opacity: 1;
        }
    </style>

    <!-- Check if transitioning and show cover immediately -->
    <script>
        if (sessionStorage.getItem('playEnterTransition') === 'true') {
            document.write('<div class="transition-cover active"></div>');
        }
    </script>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-container">
            <div class="nav-logo">Christopher Perov</div>
            <ul class="nav-menu">
                <li><a href="#chibi-space">Chibis</a></li>
                <li><a href="#character-space">Characters</a></li>
                <li><a href="#fps-space">FPS</a></li>
                <li><a href="#props-space">Props</a></li>
                <li><a href="/portfolio/index.html#my-work">← Back</a></li>
            </ul>
            <div class="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="scroll-indicator">
        <span>Scroll</span>
        <div class="scroll-line"></div>
    </div>

    <div class="models-container">

        <section class="model-space chibi-space" id="chibi-space">
            <div class="space-title">Chibi Characters</div>
            <div class="space-canvas" data-group="chibi"></div>
        </section>

        <section class="model-space character-space" id="character-space">
            <div class="space-title">Full Size Characters</div>
            <div class="space-canvas" data-group="character"></div>
        </section>

        <section class="model-space fps-space" id="fps-space">
            <div class="space-title">FPS Assets</div>
            <div class="space-canvas" data-group="fps"></div>
        </section>

        <section class="model-space props-space" id="props-space">
            <div class="space-title">Environment Props</div>
            <div class="space-canvas" data-group="props"></div>
        </section>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script type="module" src="./models.js"></script>
    <script type="module" src="../src/transitions-init.js"></script>
    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const navMenu = document.querySelector('.nav-menu');
        if (navToggle && navMenu) {
            navToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                navToggle.classList.toggle('active');
            });
        }
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(anchor.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    if (navMenu?.classList.contains('active')) {
                        navMenu.classList.remove('active');
                        navToggle?.classList.remove('active');
                    }
                }
            });
        });
    </script>
</body>
</html>
